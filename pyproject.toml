[project]
name = "process-metrics-lab"
version = "0.1.0"
description = "Event spec, KPI definitions, SQL, data-quality checks and a dashboard for one support process, tested against planted effects."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Hossam Afifi" }]
dependencies = [
    "duckdb>=2.0.0",
]

[project.urls]
Repository = "https://github.com/AfifiNL/process-metrics-lab"

[project.scripts]
process-metrics-lab = "process_metrics.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/process_metrics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["process_metrics"]
mypy_path = "src"
